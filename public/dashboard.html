<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SILA MD - Session Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #00d4ff;
            margin-bottom: 30px;
        }
        
        .header h1 { font-size: 2.5rem; color: #00d4ff; }
        .header p { color: #aaa; margin-top: 10px; }
        
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .nav-links a {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            transition: 0.3s;
        }
        
        .nav-links a:hover, .nav-links a.active {
            background: #00d4ff;
            color: #1a1a2e;
        }
        
        .session-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
            border-left: 4px solid #00d4ff;
        }
        
        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .session-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d4ff;
        }
        
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        
        .status-active {
            background: #00ff8844;
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        
        .status-inactive {
            background: #ff444444;
            color: #ff4444;
            border: 1px solid #ff4444;
        }
        
        .session-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .detail-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
        }
        
        .detail-label {
            font-size: 0.8rem;
            color: #aaa;
        }
        
        .detail-value {
            font-size: 1.1rem;
            font-weight: bold;
        }
        
        .session-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        
        .btn-success { background: #00ff88; color: #1a1a2e; }
        .btn-warning { background: #ffaa00; color: #1a1a2e; }
        .btn-danger { background: #ff4444; color: white; }
        .btn-info { background: #00d4ff; color: #1a1a2e; }
        
        .refresh-btn {
            background: #00d4ff;
            color: #1a1a2e;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .pin-panel {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            margin: 50px auto;
        }
        
        .pin-panel input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: none;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
            border: 1px solid #333;
        }
        
        .pin-panel button {
            background: #00d4ff;
            color: #1a1a2e;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .loading { text-align: center; padding: 50px; color: #00d4ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 Session Dashboard</h1>
            <p>View and manage all bot sessions</p>
        </div>
        
        <div id="pinPanel" class="pin-panel">
            <h2>🔐 Admin Access</h2>
            <input type="password" id="adminPin" placeholder="Enter PIN">
            <button onclick="verifyPin()">Access Dashboard</button>
        </div>
        
        <div id="mainContent" style="display: none;">
            <div class="nav-links">
                <a href="/admin">📊 Dashboard</a>
                <a href="/dashboard" class="active">📱 Sessions</a>
                <a href="/settings">⚙️ Settings</a>
            </div>
            
            <button class="refresh-btn" onclick="loadSessions()">🔄 Refresh</button>
            
            <div id="sessionsList"></div>
        </div>
    </div>
    
    <script>
        let currentPin = '';
        
        function verifyPin() {
            const pin = document.getElementById('adminPin').value;
            if (pin === 'sila0022') {
                currentPin = pin;
                document.getElementById('pinPanel').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                loadSessions();
                setInterval(loadSessions, 30000);
            } else {
                alert('Invalid PIN!');
            }
        }
        
        async function loadSessions() {
            try {
                const response = await fetch(`/api/sessions?pin=${currentPin}`);
                const data = await response.json();
                
                if (data.error && data.required) {
                    document.getElementById('pinPanel').style.display = 'block';
                    document.getElementById('mainContent').style.display = 'none';
                    return;
                }
                
                const container = document.getElementById('sessionsList');
                container.innerHTML = '';
                
                if (data.sessions && data.sessions.length > 0) {
                    data.sessions.forEach(session => {
                        const card = document.createElement('div');
                        card.className = 'session-card';
                        card.innerHTML = `
                            <div class="session-header">
                                <span class="session-number">📱 +${session.number}</span>
                                <span class="status-badge ${session.isActive ? 'status-active' : 'status-inactive'}">
                                    ${session.isActive ? '🟢 ACTIVE' : '🔴 INACTIVE'}
                                </span>
                            </div>
                            <div class="session-details">
                                <div class="detail-item">
                                    <div class="detail-label">Uptime</div>
                                    <div class="detail-value">${session.uptimeFormatted || '-'}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Commands Used</div>
                                    <div class="detail-value">${session.stats?.commandsUsed || 0}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Messages Received</div>
                                    <div class="detail-value">${session.stats?.messagesReceived || 0}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Connected Since</div>
                                    <div class="detail-value">${session.connectionTime || '-'}</div>
                                </div>
                            </div>
                            <div class="session-actions">
                                ${!session.isActive ? `<button class="btn btn-success" onclick="reconnectSession('${session.number}')">🔄 Reconnect</button>` : ''}
                                <button class="btn btn-warning" onclick="disconnectSession('${session.number}')">🔌 Disconnect</button>
                                <button class="btn btn-danger" onclick="deleteSession('${session.number}')">🗑️ Delete</button>
                                <button class="btn btn-info" onclick="viewConfig('${session.number}')">⚙️ Config</button>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<div class="loading">No sessions found</div>';
                }
            } catch (error) {
                console.error('Error loading sessions:', error);
            }
        }
        
        async function disconnectSession(number) {
            if (!confirm(`Disconnect +${number}?`)) return;
            try {
                const response = await fetch('/api/disconnect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number, pin: currentPin })
                });
                const data = await response.json();
                if (data.success) {
                    alert(data.message);
                    loadSessions();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        async function deleteSession(number) {
            if (!confirm(`⚠️ PERMANENTLY delete session +${number}?`)) return;
            try {
                const response = await fetch('/api/delete-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number, pin: currentPin })
                });
                const data = await response.json();
                if (data.success) {
                    alert(data.message);
                    loadSessions();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        async function reconnectSession(number) {
            try {
                const response = await fetch('/api/reconnect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number, pin: currentPin })
                });
                const data = await response.json();
                if (data.success) {
                    alert(data.message);
                    loadSessions();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        function viewConfig(number) {
            window.location.href = `/settings?number=${number}`;
        }
    </script>
</body>
</html>
