<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SILA MD - Bot Settings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #00d4ff;
            margin-bottom: 30px;
        }
        
        .header h1 { font-size: 2.5rem; color: #00d4ff; }
        .header p { color: #aaa; margin-top: 10px; }
        
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .nav-links a {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            transition: 0.3s;
        }
        
        .nav-links a:hover, .nav-links a.active {
            background: #00d4ff;
            color: #1a1a2e;
        }
        
        .settings-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(5px);
        }
        
        .settings-card h3 {
            color: #00d4ff;
            margin-bottom: 20px;
            border-left: 3px solid #00d4ff;
            padding-left: 15px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
        }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
            border: 1px solid #333;
            font-size: 14px;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .checkbox-group input {
            width: auto;
        }
        
        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }
        
        .btn-primary {
            background: #00d4ff;
            color: #1a1a2e;
        }
        
        .btn-danger {
            background: #ff4444;
            color: white;
        }
        
        .btn-success {
            background: #00ff88;
            color: #1a1a2e;
        }
        
        .pin-panel {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            margin: 50px auto;
        }
        
        .pin-panel input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: none;
            border-radius: 8px;
            background: #0f0f1a;
            color: #fff;
            border: 1px solid #333;
        }
        
        .pin-panel button {
            background: #00d4ff;
            color: #1a1a2e;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert-success {
            background: #00ff8844;
            border: 1px solid #00ff88;
            color: #00ff88;
        }
        
        .alert-error {
            background: #ff444444;
            border: 1px solid #ff4444;
            color: #ff4444;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .loading { text-align: center; padding: 50px; color: #00d4ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ Bot Settings</h1>
            <p>Configure your WhatsApp bot</p>
        </div>
        
        <div id="pinPanel" class="pin-panel">
            <h2>🔐 Admin Access</h2>
            <input type="password" id="adminPin" placeholder="Enter PIN">
            <button onclick="verifyPin()">Access Settings</button>
        </div>
        
        <div id="mainContent" style="display: none;">
            <div class="nav-links">
                <a href="/admin">📊 Dashboard</a>
                <a href="/dashboard">📱 Sessions</a>
                <a href="/settings" class="active">⚙️ Settings</a>
            </div>
            
            <div id="alert" class="alert"></div>
            
            <!-- MongoDB Settings -->
            <div class="settings-card">
                <h3>🗄️ MongoDB Configuration</h3>
                <div class="form-group">
                    <label>MongoDB URI</label>
                    <input type="text" id="mongodbUri" placeholder="mongodb+srv://...">
                </div>
                <button class="btn btn-primary" onclick="updateMongoDB()">Update MongoDB URI</button>
                <button class="btn btn-danger" onclick="restartBot()">Restart Bot</button>
            </div>
            
            <!-- Bot Configuration -->
            <div class="settings-card">
                <h3>🤖 Bot Configuration</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Command Prefix</label>
                        <input type="text" id="prefix" value=".">
                    </div>
                    <div class="form-group">
                        <label>Owner Number</label>
                        <input type="text" id="ownerNumber" placeholder="255XXXXXXXXX">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="welcome">
                        <label>Enable Welcome Message</label>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="autoViewStatus">
                        <label>Auto View Status</label>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="autoLikeStatus">
                        <label>Auto Like Status</label>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="autoRecording">
                        <label>Auto Recording</label>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="autoTyping">
                        <label>Auto Typing</label>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="autoReply">
                        <label>Auto Reply</label>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="antiCall">
                        <label>Anti Call</label>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="antiDelete">
                        <label>Anti Delete</label>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="antiLink">
                        <label>Anti Link</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Auto Like Emojis (comma separated)</label>
                    <input type="text" id="autoLikeEmoji" value="💥,👍,😍,💗,🎈,🎉,🥳,😎,🚀,🔥">
                </div>
                
                <div class="form-group">
                    <label>Bot Image URL</label>
                    <input type="text" id="rcdImagePath" value="https://i.ibb.co/4RM2GC9F/Sila-mini.jpg">
                </div>
                
                <div class="form-group">
                    <label>Channel Link</label>
                    <input type="text" id="channelLink" value="https://whatsapp.com/channel/0029VbBG4gfISTkCpKxyMH02">
                </div>
                
                <div class="form-group">
                    <label>Newsletter JID</label>
                    <input type="text" id="newsletterJid" value="120363402325089913@newsletter">
                </div>
                
                <div class="form-group">
                    <label>Group Invite Link</label>
                    <input type="text" id="groupInviteLink" value="https://chat.whatsapp.com/IdGNaKt80DEBqirc2ek4ks">
                </div>
                
                <button class="btn btn-success" onclick="saveConfig()">💾 Save Configuration</button>
            </div>
            
            <!-- Auto Replies Management -->
            <div class="settings-card">
                <h3>💬 Auto Replies</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Trigger Word</label>
                        <input type="text" id="triggerWord" placeholder="e.g., hi, hello, mambo">
                    </div>
                    <div class="form-group">
                        <label>Reply Message</label>
                        <input type="text" id="replyMessage" placeholder="Reply text">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="addAutoReply()">➕ Add Auto Reply</button>
                <div id="autoRepliesList" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>
    
    <script>
        let currentPin = '';
        let currentNumber = '';
        
        function verifyPin() {
            const pin = document.getElementById('adminPin').value;
            if (pin === 'sila0022') {
                currentPin = pin;
                document.getElementById('pinPanel').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                loadSettings();
                loadAutoReplies();
                
                const urlParams = new URLSearchParams(window.location.search);
                currentNumber = urlParams.get('number');
                if (currentNumber) {
                    document.getElementById('alert').style.display = 'block';
                    showAlert(`Editing config for +${currentNumber}`, 'success');
                }
            } else {
                alert('Invalid PIN!');
            }
        }
        
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 3000);
        }
        
        async function loadSettings() {
            try {
                const response = await fetch(`/api/settings?pin=${currentPin}`);
                const data = await response.json();
                
                if (data.settings) {
                    document.getElementById('mongodbUri').value = data.settings.mongodbUri || '';
                    document.getElementById('prefix').value = data.settings.defaultConfig?.PREFIX || '.';
                    document.getElementById('ownerNumber').value = data.settings.defaultConfig?.OWNER_NUMBER || '';
                    document.getElementById('rcdImagePath').value = data.settings.defaultConfig?.RCD_IMAGE_PATH || '';
                    document.getElementById('channelLink').value = data.settings.defaultConfig?.CHANNEL_LINK || '';
                    document.getElementById('newsletterJid').value = data.settings.defaultConfig?.NEWSLETTER_JID || '';
                    document.getElementById('groupInviteLink').value = data.settings.defaultConfig?.GROUP_INVITE_LINK || '';
                    document.getElementById('autoLikeEmoji').value = (data.settings.defaultConfig?.AUTO_LIKE_EMOJI || []).join(',');
                    
                    document.getElementById('welcome').checked = data.settings.defaultConfig?.WELCOME === 'true';
                    document.getElementById('autoViewStatus').checked = data.settings.defaultConfig?.AUTO_VIEW_STATUS === 'true';
                    document.getElementById('autoLikeStatus').checked = data.settings.defaultConfig?.AUTO_LIKE_STATUS === 'true';
                    document.getElementById('autoRecording').checked = data.settings.defaultConfig?.AUTO_RECORDING === 'true';
                    document.getElementById('autoTyping').checked = data.settings.defaultConfig?.AUTO_TYPING === 'true';
                    document.getElementById('autoReply').checked = data.settings.defaultConfig?.AUTO_REPLY === 'true';
                    document.getElementById('antiCall').checked = data.settings.defaultConfig?.ANTI_CALL === 'true';
                    document.getElementById('antiDelete').checked = data.settings.defaultConfig?.ANTI_DELETE === 'true';
                    document.getElementById('antiLink').checked = data.settings.defaultConfig?.ANTI_LINK === 'true';
                }
            } catch (error) {
                console.error('Error loading settings:', error);
            }
        }
        
        async function updateMongoDB() {
            const mongodbUri = document.getElementById('mongodbUri').value;
            if (!mongodbUri) {
                showAlert('Please enter MongoDB URI', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/update-mongodb', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mongodbUri, pin: currentPin })
                });
                const data = await response.json();
                if (data.success) {
                    showAlert(data.message, 'success');
                } else {
                    showAlert('Error: ' + data.error, 'error');
                }
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        }
        
        async function saveConfig() {
            const config = {
                PREFIX: document.getElementById('prefix').value || '.',
                OWNER_NUMBER: document.getElementById('ownerNumber').value || '255612491554',
                RCD_IMAGE_PATH: document.getElementById('rcdImagePath').value,
                CHANNEL_LINK: document.getElementById('channelLink').value,
                NEWSLETTER_JID: document.getElementById('newsletterJid').value,
                GROUP_INVITE_LINK: document.getElementById('groupInviteLink').value,
                AUTO_LIKE_EMOJI: document.getElementById('autoLikeEmoji').value.split(',').map(e => e.trim()),
                WELCOME: document.getElementById('welcome').checked ? 'true' : 'false',
                AUTO_VIEW_STATUS: document.getElementById('autoViewStatus').checked ? 'true' : 'false',
                AUTO_LIKE_STATUS: document.getElementById('autoLikeStatus').checked ? 'true' : 'false',
                AUTO_RECORDING: document.getElementById('autoRecording').checked ? 'true' : 'false',
                AUTO_TYPING: document.getElementById('autoTyping').checked ? 'true' : 'false',
                AUTO_REPLY: document.getElementById('autoReply').checked ? 'true' : 'false',
                ANTI_CALL: document.getElementById('antiCall').checked ? 'true' : 'false',
                ANTI_DELETE: document.getElementById('antiDelete').checked ? 'true' : 'false',
                ANTI_LINK: document.getElementById('antiLink').checked ? 'true' : 'false'
            };
            
            try {
                let url = '/api/update-config';
                let body = { config, pin: currentPin };
                
                if (currentNumber) {
                    body.number = currentNumber;
                }
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await response.json();
                if (data.success) {
                    showAlert(data.message, 'success');
                } else {
                    showAlert('Error: ' + data.error, 'error');
                }
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        }
        
        async function restartBot() {
            if (!confirm('Restart bot? This may take a few seconds.')) return;
            try {
                const response = await fetch('/api/restart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: currentPin })
                });
                const data = await response.json();
                if (data.success) {
                    showAlert(data.message, 'success');
                    setTimeout(() => {
                        window.location.reload();
                    }, 3000);
                } else {
                    showAlert('Error: ' + data.error, 'error');
                }
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        }
        
        async function loadAutoReplies() {
            // Auto replies loading logic
            const container = document.getElementById('autoRepliesList');
            container.innerHTML = '<div class="loading">Loading auto replies...</div>';
            
            // You can implement auto replies CRUD here
            container.innerHTML = '<p>Auto replies feature coming soon...</p>';
        }
        
        async function addAutoReply() {
            const trigger = document.getElementById('triggerWord').value.trim();
            const reply = document.getElementById('replyMessage').value.trim();
            
            if (!trigger || !reply) {
                showAlert('Please enter both trigger word and reply message', 'error');
                return;
            }
            
            showAlert(`Auto reply added: "${trigger}" -> "${reply}"`, 'success');
            document.getElementById('triggerWord').value = '';
            document.getElementById('replyMessage').value = '';
            loadAutoReplies();
        }
    </script>
</body>
</html>
