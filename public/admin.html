<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SILA MD - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #00d4ff;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            color: #00d4ff;
        }
        
        .header p {
            color: #aaa;
            margin-top: 10px;
        }
        
        .pin-panel {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            margin: 50px auto;
            backdrop-filter: blur(10px);
            border: 1px solid #00d4ff;
        }
        
        .pin-panel input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: #0f0f1a;
            color: #fff;
            border: 1px solid #333;
        }
        
        .pin-panel button {
            background: #00d4ff;
            color: #1a1a2e;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(5px);
        }
        
        .stat-card h3 {
            color: #00d4ff;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .sessions-table {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        
        th {
            background: #00d4ff;
            color: #1a1a2e;
        }
        
        .status-active {
            color: #00ff88;
            font-weight: bold;
        }
        
        .status-inactive {
            color: #ff4444;
            font-weight: bold;
        }
        
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 2px;
            font-size: 12px;
        }
        
        .btn-danger {
            background: #ff4444;
            color: white;
        }
        
        .btn-warning {
            background: #ffaa00;
            color: #1a1a2e;
        }
        
        .btn-success {
            background: #00ff88;
            color: #1a1a2e;
        }
        
        .btn-info {
            background: #00d4ff;
            color: #1a1a2e;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #00d4ff;
        }
        
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .nav-links a {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            transition: 0.3s;
        }
        
        .nav-links a:hover, .nav-links a.active {
            background: #00d4ff;
            color: #1a1a2e;
        }
        
        .refresh-btn {
            background: #00d4ff;
            color: #1a1a2e;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐢 SILA MD ADMIN PANEL</h1>
            <p>Manage your WhatsApp bot sessions</p>
        </div>
        
        <div id="pinPanel" class="pin-panel">
            <h2>🔐 Admin Access</h2>
            <p>Enter PIN to continue</p>
            <input type="password" id="adminPin" placeholder="Enter PIN">
            <button onclick="verifyPin()">Access Panel</button>
        </div>
        
        <div id="mainContent" style="display: none;">
            <div class="nav-links">
                <a href="/admin" class="active">📊 Dashboard</a>
                <a href="/dashboard">📱 Sessions</a>
                <a href="/settings">⚙️ Settings</a>
            </div>
            
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <h3>Total Sessions</h3>
                    <div class="value" id="totalSessions">-</div>
                </div>
                <div class="stat-card">
                    <h3>Active Connections</h3>
                    <div class="value" id="activeSessions">-</div>
                </div>
                <div class="stat-card">
                    <h3>Server Uptime</h3>
                    <div class="value" id="serverUptime">-</div>
                </div>
                <div class="stat-card">
                    <h3>Memory Usage</h3>
                    <div class="value" id="memoryUsage">-</div>
                </div>
            </div>
            
            <button class="refresh-btn" onclick="loadSessions()">🔄 Refresh Data</button>
            
            <div class="sessions-table">
                <table>
                    <thead>
                        <tr>
                            <th>Number</th>
                            <th>Status</th>
                            <th>Uptime</th>
                            <th>Commands Used</th>
                            <th>Messages</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="sessionsTableBody">
                        <tr><td colspan="6" class="loading">Loading sessions...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        let currentPin = '';
        
        function verifyPin() {
            const pin = document.getElementById('adminPin').value;
            if (pin === 'sila0022') {
                currentPin = pin;
                document.getElementById('pinPanel').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                loadSessions();
                setInterval(loadSessions, 30000);
            } else {
                alert('Invalid PIN!');
            }
        }
        
        async function loadSessions() {
            try {
                const response = await fetch(`/api/sessions?pin=${currentPin}`);
                const data = await response.json();
                
                if (data.error && data.required) {
                    document.getElementById('pinPanel').style.display = 'block';
                    document.getElementById('mainContent').style.display = 'none';
                    return;
                }
                
                document.getElementById('totalSessions').textContent = data.total || 0;
                document.getElementById('activeSessions').textContent = data.active || 0;
                document.getElementById('serverUptime').textContent = data.serverUptime || '-';
                document.getElementById('memoryUsage').textContent = data.memoryUsage ? 
                    `${(data.memoryUsage.heapUsed / 1024 / 1024).toFixed(2)} MB` : '-';
                
                const tbody = document.getElementById('sessionsTableBody');
                tbody.innerHTML = '';
                
                if (data.sessions && data.sessions.length > 0) {
                    data.sessions.forEach(session => {
                        const row = tbody.insertRow();
                        row.innerHTML = `
                            <td>+${session.number}</td>
                            <td class="${session.isActive ? 'status-active' : 'status-inactive'}">
                                ${session.isActive ? '🟢 Active' : '🔴 Inactive'}
                            </td>
                            <td>${session.uptimeFormatted || '-'}</td>
                            <td>${session.stats?.commandsUsed || 0}</td>
                            <td>${session.stats?.messagesReceived || 0}</td>
                            <td>
                                ${!session.isActive ? `<button class="btn btn-success" onclick="reconnectSession('${session.number}')">Reconnect</button>` : ''}
                                <button class="btn btn-warning" onclick="disconnectSession('${session.number}')">Disconnect</button>
                                <button class="btn btn-danger" onclick="deleteSession('${session.number}')">Delete</button>
                            </td>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No sessions found</td></tr>';
                }
            } catch (error) {
                console.error('Error loading sessions:', error);
            }
        }
        
        async function disconnectSession(number) {
            if (!confirm(`Are you sure you want to disconnect +${number}?`)) return;
            
            try {
                const response = await fetch('/api/disconnect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number: number, pin: currentPin })
                });
                const data = await response.json();
                if (data.success) {
                    alert(data.message);
                    loadSessions();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        async function deleteSession(number) {
            if (!confirm(`⚠️ WARNING: This will permanently delete session +${number}! Continue?`)) return;
            
            try {
                const response = await fetch('/api/delete-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number: number, pin: currentPin })
                });
                const data = await response.json();
                if (data.success) {
                    alert(data.message);
                    loadSessions();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        async function reconnectSession(number) {
            try {
                const response = await fetch('/api/reconnect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number: number, pin: currentPin })
                });
                const data = await response.json();
                if (data.success) {
                    alert(data.message);
                    loadSessions();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
